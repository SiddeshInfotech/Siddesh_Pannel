# CI — quality gate. Runs on every pull request into beta-testing / main and on pushes to any
# other branch. The Deploy workflow calls this same file first, so NOTHING is deployed or
# migrated unless all of these pass. Uses no real secrets: the build gets throwaway keys.
name: CI

on:
  pull_request:
    branches: [beta-testing, main]
  push:
    branches-ignore: [beta-testing, main] # those two run CI inside deploy.yml
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # keep equal to Vercel → Project Settings → Node.js Version
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check migration files
        run: node db/migrate.mjs check

      # src/lib/auth.ts, proxy.ts and crypto.ts read their keys when the module loads, so
      # `next build` needs values. Fresh random ones are generated per run and never leave it.
      - name: Throwaway build keys
        run: |
          {
            echo 'ADMIN_JWT_PRIVATE_KEY<<PEM_EOF'
            node -e "process.stdout.write(require('crypto').generateKeyPairSync('ec',{namedCurve:'P-256'}).privateKey.export({type:'pkcs8',format:'pem'}))"
            echo
            echo 'PEM_EOF'
            echo "LMS_MASTER_CEK=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
            echo 'SUPABASE_URL=https://ci-placeholder.supabase.co'
            echo 'SUPABASE_ANON_KEY=ci-placeholder'
            echo 'SUPABASE_SERVICE_ROLE_KEY=ci-placeholder'
            echo 'NEXT_TELEMETRY_DISABLED=1'
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
