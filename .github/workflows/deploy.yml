# Deploy — the CD half of the pipeline.
#
#   push to beta-testing ──► CI ──► migrate STAGING DB ──► Vercel preview  (+ staging domain)
#   push to main         ──► CI ──► migrate PRODUCTION DB ──► Vercel production
#
# Each step only runs if the previous one passed, so a failing test or migration never
# reaches a server. Setup (secrets, Vercel settings, staging database): Documents/CICD.md.
name: Deploy

on:
  push:
    branches: [beta-testing, main]
  workflow_dispatch: # "Run workflow" → pick beta-testing or main to redeploy it

permissions:
  contents: read

# One deploy per branch at a time; a newer push waits instead of racing the running one.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  target:
    name: Pick target
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.t.outputs.name }}
      prefix: ${{ steps.t.outputs.prefix }}
      vercel_env: ${{ steps.t.outputs.vercel_env }}
    steps:
      - id: t
        run: |
          case "$GITHUB_REF_NAME" in
            main)         echo "name=production" >> "$GITHUB_OUTPUT"; echo "prefix=PRODUCTION" >> "$GITHUB_OUTPUT"; echo "vercel_env=production" >> "$GITHUB_OUTPUT" ;;
            beta-testing) echo "name=staging"    >> "$GITHUB_OUTPUT"; echo "prefix=STAGING"    >> "$GITHUB_OUTPUT"; echo "vercel_env=preview"    >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Deploys run only from main (production) or beta-testing (staging)."; exit 1 ;;
          esac

  ci:
    name: CI
    needs: target
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Migrate ${{ needs.target.outputs.name }} database
    needs: [target, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets[format('{0}_DATABASE_URL', needs.target.outputs.prefix)] }}
      DB_CA_CERT: ${{ secrets[format('{0}_DB_CA_CERT', needs.target.outputs.prefix)] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret ${{ needs.target.outputs.prefix }}_DATABASE_URL is not set (Documents/CICD.md, step 3)."
            exit 1
          fi
      - name: Pending migrations
        run: node db/migrate.mjs status
      - name: Apply migrations
        run: node db/migrate.mjs up

  deploy:
    name: Deploy to ${{ needs.target.outputs.name }}
    needs: [target, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENV: ${{ needs.target.outputs.vercel_env }}
      PROD_FLAG: ${{ needs.target.outputs.vercel_env == 'production' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Vercel secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set (Documents/CICD.md, step 2)."; exit 1; fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel@61.1.0
      # Real environment variables come from Vercel (Preview = staging values, Production =
      # production values); GitHub never holds the app's runtime secrets.
      - name: Pull Vercel settings and env (${{ needs.target.outputs.vercel_env }})
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Point staging domain at this deployment
        if: needs.target.outputs.name == 'staging' && vars.STAGING_DOMAIN != ''
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "${{ vars.STAGING_DOMAIN }}" --token="$VERCEL_TOKEN"
      - name: Smoke test (login page answers)
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          args=()
          if [ -n "$BYPASS" ]; then args=(-H "x-vercel-protection-bypass: $BYPASS"); fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${args[@]}" "$URL/lms-admin")
          echo "GET /lms-admin → $code"
          if [ "$code" = "200" ]; then exit 0; fi
          if [ -z "$BYPASS" ] && { [ "$code" = "401" ] || [ "$code" = "403" ]; }; then
            echo "::warning::Deployment is behind Vercel Deployment Protection; set VERCEL_AUTOMATION_BYPASS_SECRET to smoke-test it."
            exit 0
          fi
          echo "::error::Smoke test failed (HTTP $code). Roll back in Vercel → Deployments → Instant Rollback if this is production."
          exit 1
      - name: Summary
        run: |
          {
            echo "### Deployed to ${{ needs.target.outputs.name }}"
            echo "- Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            if [ -n "${{ vars.STAGING_DOMAIN }}" ] && [ "${{ needs.target.outputs.name }}" = "staging" ]; then echo "- Staging domain: https://${{ vars.STAGING_DOMAIN }}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
